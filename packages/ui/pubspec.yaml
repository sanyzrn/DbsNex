name: nex_ui
description: >-
  Shared Flutter widget and design-token package for Nex. Depends on the core
  domain models only — never on the storage or transport layer.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # After the re-export removal this is pure domain: no sqlite3, no archive,
  # no http in the design system's dependency closure.
  nex_core:
    path: ../core
  intl: ^0.20.2
  path: ^1.9.1
  # The maintained successor to flutter_markdown, which the Flutter team
  # discontinued and points at this. Three small dependencies, and it takes its
  # direction from the ambient Directionality — which is what lets NexMarkdown
  # impose the text's own direction rather than the interface's.
  flutter_markdown_plus: ^1.0.12
  # The parser flutter_markdown_plus is built on, and already in this package's
  # dependency closure through it. Declared directly because NexMarkdown's own
  # element builder has to name `md.Element` to override the hook it hangs on.
  # Nothing new is resolved by this line; it only stops the name being reached
  # through somebody else's dependency.
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
