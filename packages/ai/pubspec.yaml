name: nex_ai
description: >-
  Nex optional AI leaf (v3+). Re-exports Core AI contracts/adapters. Deleting
  this package must leave core/data/client compiling (see docs/09-ai.md).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  nex_core:
    path: ../core
  # Phase 0 of the offline-AI roadmap (docs/09-ai.md): a local llama.cpp
  # runtime, pinned to an exact pre-1.0 dev build rather than a caret range —
  # this is a feasibility harness, not a shipped adapter, and the API is
  # still moving under 0.9.x. Re-pin deliberately, don't let it float.
  llama_cpp_dart: 0.9.0-dev.10

dev_dependencies:
  lints: ^5.0.0
  nex_data:
    path: ../data
  test: ^1.25.0
