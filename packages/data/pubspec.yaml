name: nex_data
description: >-
  Nex local-first data layer. Pure Dart, zero Flutter dependency. Implements the
  ports declared in nex_core: owns the schema, the SQLite repository and (from
  v2) the sync client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.6.0
  crypto: ^3.0.6
  http: ^1.2.2
  # The arrow is inverted: data now depends on core, not the reverse. Core owns
  # the models and the port interfaces; this package implements them.
  nex_core:
    path: ../core
  path: ^1.9.1
  sqlite3: ^3.8.0
  uuid: ^4.5.1

dev_dependencies:
  lints: ^6.1.0
  # Shared toolchain: .fvmrc and all pure-Dart CI jobs pin Dart 3.13.7.
  test: ^1.33.0
