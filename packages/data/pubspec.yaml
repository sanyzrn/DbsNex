name: nex_data
description: >-
  Nex local-first data layer. Pure Dart, zero Flutter dependency. Owns the
  schema, repository interfaces and (from v2) the sync client.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^4.0.2
  crypto: ^3.0.6
  path: ^1.9.1
  sqlite3: ^2.7.5
  uuid: ^4.5.1

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
