name: Temporary PR 418 Dart formatting

on:
  push:
    branches:
      - fix/nex269-reminder-visibility

permissions:
  contents: write

jobs:
  apply-format:
    name: Apply pinned Dart formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.7"
      - name: Format only changed Dart sources
        run: dart format packages/ui/lib/widgets/nex_popup_menu.dart apps/client/lib/widgets/note_context_menu.dart apps/client/lib/screens/timeline/timeline_note_actions.dart apps/client/lib/screens/note_detail_sheet.dart apps/client/test/goldens/golden_test.dart
      - name: Push formatted output once
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git add packages/ui/lib/widgets/nex_popup_menu.dart apps/client/lib/widgets/note_context_menu.dart apps/client/lib/screens/timeline/timeline_note_actions.dart apps/client/lib/screens/note_detail_sheet.dart apps/client/test/goldens/golden_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format note reminder detail labels"
          git push origin "HEAD:refs/heads/$HEAD_REF"
