name: Integrate Smart Summary audit safely

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.smart-summary-fix.patch'
      - '.github/workflows/nex-smart-summary-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/nex-smart-summary-audit-2619'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Validate original audit patch against Nex 2.6.19
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = '2.6.19'
          echo '094e9c76b22ac4f1659053c6930075b2080f8c781de8997628b4f78657a6248f  .smart-summary-fix.patch' | sha256sum -c -
          git apply --check .smart-summary-fix.patch
          git apply .smart-summary-fix.patch
      - name: Keep urgent notes visible even beyond the waiting-note cap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/data/lib/repositories/note_repository.dart')
          text = path.read_text()
          old = 'ORDER BY (due_at IS NULL), due_at ASC, updated_at DESC'
          new = 'ORDER BY is_urgent DESC, (due_at IS NULL), due_at ASC, updated_at DESC'
          assert text.count(old) == 1, 'Unexpected waiting-note SQL'
          path.write_text(text.replace(old, new, 1))

          path = Path('packages/data/test/brief_waiting_test.dart')
          text = path.read_text()
          old = "test('dated first and soonest first, urgent rest newest first'"
          assert text.count(old) == 1
          text = text.replace(old, "test('urgent first, then dated soonest first'", 1)
          old = """      'sooner',
                'later',
                'newer-urgent',
                'older-urgent',"""
          new = """      'newer-urgent',
                'older-urgent',
                'sooner',
                'later',"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = "expect(waiting.map((note) => note.id), ['dated0', 'dated1']);"
          new = "expect(waiting.map((note) => note.id), ['urgent', 'dated0']);"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = "expect(waiting.map((note) => note.id), isNot(contains(urgent.id)));"
          new = "expect(waiting.map((note) => note.id), contains(urgent.id));"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          close = '\n}'
          assert text.endswith(close)
          extra = """

            test('an urgent note survives more than 200 dated reminders', () {
              final urgent = capture('priority', 'please do this', urgent: true);
              for (var i = 0; i < 205; i++) {
                final dated = capture('dated$i', 'appointment $i');
                repo.setDueAt(
                  dated.id,
                  DateTime.now().add(Duration(days: i + 1)),
                );
              }
              final waiting = repo.listBriefWaiting(limit: 200);
              expect(waiting, hasLength(200));
              expect(waiting.first.id, urgent.id);
            });
          """
          text = text[:-len(close)] + extra + close
          path.write_text(text)
          PY
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - name: Format changed sources and confirm no malformed diff
        shell: bash
        run: |
          set -euo pipefail
          dart format packages/core/lib/ai/recap_source.dart packages/core/lib/ports/note_repository.dart packages/core/test/recap_one_line_test.dart packages/core/test/tool_registry_test.dart packages/data/lib/repositories/note_repository.dart packages/data/test/brief_waiting_test.dart apps/client/lib/platform/db_worker.dart apps/client/lib/platform/db_worker_client.dart apps/client/lib/platform/db_worker_dispatch.dart apps/client/lib/platform/nex_db.dart apps/client/lib/platform/nex_services.dart apps/client/lib/screens/timeline/timeline_ai_header.dart apps/client/lib/screens/timeline/timeline_body.dart apps/client/lib/screens/timeline_screen.dart apps/client/test/brief_window_test.dart apps/client/test/support/in_process_db.dart
          git diff --check
      - name: Commit reviewed changes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .smart-summary-fix.patch .github/workflows/nex-smart-summary-integrate.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: integrate reviewed Smart Summary audit and urgent-note priority'
          git push origin HEAD:fix/nex-smart-summary-audit-2619
