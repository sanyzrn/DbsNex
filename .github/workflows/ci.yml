name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 pipeline (11-build-prompt.md): Dart analyze/lint, `dart test` for
# packages/*, a Flutter build check for apps/client, and backend lint/typecheck.
# There is deliberately almost nothing to test yet — the pipeline must exist
# before Phase 1 code lands.

jobs:
  dart-packages:
    name: Pure Dart packages (analyze + test, no Flutter SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, data, ai]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Proves packages/core and packages/data carry zero Flutter dependency:
      # this job never installs Flutter.
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  flutter-ui-package:
    name: packages/ui (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  client-android:
    name: apps/client (analyze + test + Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

  client-windows:
    name: apps/client (Windows desktop build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug

  backend:
    name: apps/backend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint

  react-prototype:
    name: React prototype (build only — not a shipping target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
