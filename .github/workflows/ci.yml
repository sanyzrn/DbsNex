name: CI

on:
  # Deliberately no `push: branches: [main]`.
  #
  # Every merge used to verify the same tree twice: once as a pull request,
  # then again on main a second later. Measured, that was half of all the
  # minutes this repository spends — roughly 23 of the 46 billed per merged
  # pull request — to re-check code that had just been checked.
  #
  # It is safe to drop because both ends are still covered. A `pull_request`
  # run checks out `refs/pull/N/merge`, the merge result, not the branch tip
  # — so what is verified is what main will become. And release.yml calls
  # this entire workflow through its `verify` job before it builds anything,
  # so nothing reaches a release without a full pass over the exact tree
  # being released.
  #
  # What it does cost: main is no longer verified at the moment of merging.
  # If two pull requests each pass against an older main and then interleave,
  # the combination is first checked at release time rather than merge time.
  # With merges going in one at a time that window is small, and the failure
  # surfaces before anything ships rather than after.
  pull_request:
  # Callable from release.yml so a tag cannot ship unverified code.
  workflow_call:

# Pushing three commits to a PR used to run three full matrices in parallel,
# including a 2x-billed Windows runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Phase 1 pipeline: Dart analyze/lint, dart test for
# packages/* (including SQLite/FTS integration), Flutter analyze/test/build for
# apps/client, and backend lint/typecheck/test.

jobs:
  # Which halves of the repo a pull request actually touched.
  #
  # A Flutter-only change was paying for the backend suite, the PostgreSQL sync
  # matrix and a Windows runner, none of which could possibly be affected. On
  # anything that is not a pull request — a push to main, or the release
  # workflow calling in — every flag is true, because there is no base to
  # compare against and a release must verify everything.
  #
  # Deliberately plain git rather than a paths-filter action: this gates the
  # only required check, so it should be readable without trusting a third
  # party, and `git diff --name-only` is the whole implementation.
  changes:
    name: Which areas changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      # Narrower than `dart`: whether the Gradle build itself could have
      # changed. A pure Dart edit cannot break the APK build in a way
      # `flutter analyze` does not already catch, and that build is four of
      # the nine minutes client-android costs.
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: verifying everything"
            {
              echo "dart=true"
              echo "backend=true"
              echo "desktop=true"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR's own recorded base commit, not origin/$BASE.
          #
          # origin/$BASE moves, and it moves most sharply at the one moment
          # this matters: merging a pull request while its checks are still
          # running puts its commits into main, so a diff taken against main a
          # second later comes back empty. Every flag then went false, every
          # job skipped, and the run reported success — a green tick on a pull
          # request nothing had actually verified. The base SHA is fixed for
          # the life of the pull request and cannot do that.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE_SHA...HEAD" 2>/dev/null || true)
          echo "$FILES"

          # An empty list is "I could not work out what changed", not "nothing
          # changed" — a pull request with no files in it does not exist. The
          # safe reading of not knowing is to verify everything; the unsafe one
          # is what shipped untested code above.
          if [ -z "$FILES" ]; then
            echo "no diff resolved against $BASE_SHA: verifying everything"
            {
              echo "dart=true"
              echo "backend=true"
              echo "desktop=true"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          match() { printf '%s\n' "$FILES" | grep -Eq "$1"; }

          # A workflow change re-verifies everything: the pipeline itself is
          # what would otherwise be shipped untested.
          if match '^\.github/'; then
            echo "workflow changed: verifying everything"
            {
              echo "dart=true"
              echo "backend=true"
              echo "desktop=true"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DART=false; BACKEND=false; DESKTOP=false; ANDROID=false
          match '^(apps/client|packages)/' && DART=true
          # The feedback worker rides the backend flag rather than carrying
          # its own: it is nine fast tests, and nothing matched
          # `apps/feedback-worker/` at all before this, so a change to it ran
          # no job whatsoever.
          match '^apps/(backend|feedback-worker)/' && BACKEND=true
          # The sync contract spans both sides, so either one re-runs it.
          match '^(apps/client/windows|apps/client/ios|apps/client/macos)/' && DESKTOP=true
          [ "$DART" = true ] && DESKTOP=true
          # Only what the Gradle build actually reads. The android/ tree is
          # obvious; every pubspec is here too because adding or bumping a
          # dependency can pull in a native plugin, which is exactly the kind
          # of break that compiles fine and fails at assemble time.
          match '^apps/client/android/' && ANDROID=true
          match '(^|/)pubspec\.yaml$' && ANDROID=true
          {
            echo "dart=$DART"
            echo "backend=$BACKEND"
            echo "desktop=$DESKTOP"
            echo "android=$ANDROID"
          } >> "$GITHUB_OUTPUT"

  dart-packages:
    name: Pure Dart packages (analyze + test, no Flutter SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [core, data]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.0"
      # sqlite3 Dart FFI needs the system library (packages/data uses package:sqlite3).
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      # Proves packages/core and packages/data carry zero Flutter dependency:
      # this job never installs Flutter.
      #
      # packages/ai used to be in this matrix and is not any more. Phase 1 gave
      # it an on-device inference plugin (09-ai.md), so it carries Flutter now
      # and `dart pub get` cannot resolve it. That costs nothing here: the
      # claim this job exists to prove was always about core and data, and ai
      # is checked by flutter-ai-package below.
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  core-boundary:
    name: packages/core must not re-export the storage layer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Every pattern below is anchored to a real declaration. The previous
      # version grepped for a bare substring, so it matched the doc comment in
      # nex_core.dart that *quotes* the removed export, and the comment in
      # core/pubspec.yaml that records why nex_data was dropped — the job failed
      # on its own documentation.
      - name: Assert nex_core does not re-export nex_data
        run: |
          if grep -rnE "^[[:space:]]*export[[:space:]]+'package:nex_data" \
               --include='*.dart' packages/core/lib; then
            echo "::error::packages/core must not re-export packages/data (06-development.md dependency rule)"
            exit 1
          fi
      # The import guard is the one that actually holds the layering: an export
      # can only leak what an import already pulled in.
      - name: Assert nex_core does not import nex_data
        run: |
          if grep -rnE "^[[:space:]]*import[[:space:]]+'package:nex_data" \
               --include='*.dart' packages/core/lib; then
            echo "::error::packages/core must not import packages/data — the arrow is data -> core"
            exit 1
          fi
      - name: Assert nex_core does not depend on nex_data
        run: |
          if grep -qE "^[[:space:]]+nex_data[[:space:]]*:" packages/core/pubspec.yaml; then
            echo "::error::packages/core must not declare nex_data as a dependency"
            exit 1
          fi

  flutter-ai-package:
    name: packages/ai (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    defaults:
      run:
        working-directory: packages/ai
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      # nex_data is a dev dependency here (enrichment_test drives a real
      # repository), and it reaches package:sqlite3 through FFI.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  flutter-ui-package:
    name: packages/ui (analyze + test + dependency closure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      # A design system must not carry native FFI, archive or HTTP transitively.
      - name: Assert the design system has no storage dependency
        run: |
          flutter pub deps --style=compact --no-dev | tee deps.txt
          if grep -Eq '(^|[[:space:]])(sqlite3|archive|http)[[:space:]]' deps.txt; then
            echo "::error::packages/ui must not depend on the storage or transport layer"
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test

  client-android:
    name: apps/client (analyze + test + Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      # Kept identical to release.yml's Android job on purpose — see the note
      # there. This job builds debug, where lint does not run, so 17 worked
      # here while every release build died in lintVitalAnalyzeRelease; a CI
      # that does not match the release toolchain cannot catch that.
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # --flavor is required once flavorDimensions is defined (ADR-031);
      # "standard" is the AI-free default, matching what this job always
      # built before flavors existed.
      #
      # Only when the Gradle build could actually have changed — see the
      # `android` output on the changes job. analyze and test above already
      # cover a pure Dart edit; what this step catches is the manifest, the
      # Gradle config and native plugin wiring, none of which a Dart-only
      # change touches. Always true for a release (workflow_call), where the
      # real signed build has to be preceded by a full check.
      - run: flutter build apk --debug --flavor standard
        if: needs.changes.outputs.android == 'true'

  client-windows:
    name: apps/client (Windows desktop build + platform tests)
    needs: changes
    # PAUSED — Android-only focus.
    #
    # Windows runners bill at 2x and this is the longest job in the matrix, so
    # it was the single biggest draw on a 2,000-minute monthly allowance that
    # has run out twice. It is also the flakiest: the Flutter SDK download in
    # flutter-action fails intermittently with curl exit 35 (SSL connect),
    # which fails the whole run without any code being wrong.
    #
    # What this costs while paused: nothing verifies the Windows build or the
    # Windows-only platform tests, so desktop regressions land unnoticed.
    # To re-enable, restore the previous condition in place of `false` on the
    # `if:` below — "CI green" already accepts a skipped job:
    #   if: needs.changes.outputs.desktop == 'true'
    #
    # Not windows-latest. That label moved to Visual Studio 2026 in June 2026,
    # and Flutter 3.35.5 — which .fvmrc pins — predates it: its Visual Studio
    # detection does not recognise VS 2026, so it falls back to its oldest known
    # generator and the build dies with
    #
    #   Generator "Visual Studio 16 2019" could not find any instance of Visual Studio
    #
    # windows-2022 is the label GitHub documents for staying on VS 2022, which
    # this Flutter does recognise. Revisit when the Flutter pin moves forward.
    runs-on: windows-2022
    timeout-minutes: 40
    if: false
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # Plugin availability is a runtime concern: building alone hid the fact
      # that just_audio had no Windows implementation — and later that
      # open_filex has none at all, and that the OS-capture bridge threw
      # MissingPluginException out of bootstrap, so the app opened an error
      # screen rather than a timeline on a target that already ships an
      # installer. A build cannot see any of that.
      - run: flutter test test/platform_capability_test.dart test/windows_readiness_test.dart
      # The whole suite, on Windows. Most of it is platform-agnostic, but the
      # parts that touch the filesystem, path separators and the database are
      # not, and they had only ever been run on Linux.
      - run: flutter test
      - run: flutter build windows --debug

  client-ios:
    name: apps/client (iOS compile check, no signing)
    runs-on: macos-14
    timeout-minutes: 45
    # PAUSED — Android-only focus.
    #
    # macOS runners bill at 10x, which made this the most expensive minute of
    # the matrix even though it only ever ran on push. There is no iOS release
    # process yet, so this was catching drift in a target nothing ships.
    #
    # What this costs while paused: ios/ can silently drift out of buildable
    # shape again — its Podfile, deployment target and plugin registrations
    # are exactly what this job existed to keep honest. Expect to fix some
    # accumulated drift whenever iOS comes back.
    #
    # To re-enable, restore the previous condition in place of `false`:
    #   if: github.event_name == 'push' || github.event_name == 'workflow_call'
    if: false
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      # The ios/ directory is committed but was never built, so its Podfile,
      # deployment target and plugin registrations drifted silently on every
      # dependency change.
      - run: flutter build ios --debug --no-codesign

  feedback-worker:
    name: apps/feedback-worker (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/feedback-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/feedback-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    name: apps/backend (lint + typecheck + test + build + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    # The smoke step declared a DATABASE_URL for a database that was not
    # running, and then polled /health/live — which deliberately does not touch
    # the database. It looked like an integration check and was a process-start
    # check, so a broken pool config or a missing migration sailed through it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # --experimental-strip-types requires 22.6+. The engines field and
          # this runner must agree with the start script.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      # npm ci fails when package.json and the lockfile disagree; npm install
      # silently rewrote the lockfile instead.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Against the built artifact, not the sources: `npm run migrate` is what
      # the Dockerfile documents as the deploy step, and it reads its .sql from
      # dist/. It could not have worked until the build started copying them,
      # and nothing here would have noticed because CI migrates from source.
      - name: Migrate with the production entry point
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nex
        run: npm run migrate

      # After the migration, because what they test is a constraint the
      # migrations create. `npm test` above ran the same file and skipped this
      # group — the flag is what turns it on, and turning it on here is what
      # makes the skip elsewhere honest rather than convenient.
      - name: Database-backed sync cases
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nex
          NEX_PG_TESTS: "1"
        run: npx tsx --test src/services/sync-service.pg.test.ts

      - name: Smoke test the built artifact
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nex
          PORT: "4100"
        run: |
          node dist/index.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/smoke.pid"
          ok=0
          for i in $(seq 1 30); do
            # Readiness, not liveness: this is the endpoint that actually opens
            # a pooled connection, so it fails when the pool is misconfigured.
            if curl -sf http://127.0.0.1:4100/health/ready | grep -q '"database":"up"'; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$(cat "$RUNNER_TEMP/smoke.pid")" || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::built backend did not become ready against PostgreSQL"
            cat "$RUNNER_TEMP/smoke.log"
            exit 1
          fi
          # startPurgeSchedule() runs against a real database now, so warnings
          # in this log are signal rather than the expected noise they were.
          cat "$RUNNER_TEMP/smoke.log"

  merge-conformance:
    name: Merge conformance (TypeScript and Dart agree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.dart == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.0"
      - name: TypeScript implementation
        working-directory: apps/backend
        run: |
          npm ci
          npx tsx --test src/services/merge.conformance.test.ts
      - name: Dart implementation
        working-directory: packages/core
        run: |
          dart pub get
          dart test test/merge_conformance_test.dart

  sync-integration:
    name: Phase 2 sync matrix (live SyncClient + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The sync contract has two sides; a change to either one can break it.
    if: needs.changes.outputs.dart == 'true' || needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.0"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci

      - name: Apply migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nex
        run: npm run migrate:dev

      # The matrix simulates two paired devices, so seed both. It used to seed
      # one, under an id the suite never uses, and the suite never sent the
      # token anyway — so every request hit the auth middleware as anonymous.
      - name: Seed test tenant
        env:
          PGPASSWORD: postgres
        run: |
          TOKEN_A="ci-token-device-a"
          TOKEN_B="ci-token-device-b"
          HASH_A=$(printf '%s' "$TOKEN_A" | sha256sum | cut -d' ' -f1)
          HASH_B=$(printf '%s' "$TOKEN_B" | sha256sum | cut -d' ' -f1)
          psql -h localhost -U postgres -d nex -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users (id) VALUES ('00000000-0000-4000-8000-000000000000')
            ON CONFLICT DO NOTHING;
          INSERT INTO devices (device_id, user_id, label, token_hash)
          VALUES ('device-a', '00000000-0000-4000-8000-000000000000', 'ci-a', '$HASH_A')
            ON CONFLICT (device_id) DO UPDATE SET token_hash = EXCLUDED.token_hash;
          INSERT INTO devices (device_id, user_id, label, token_hash)
          VALUES ('device-b', '00000000-0000-4000-8000-000000000000', 'ci-b', '$HASH_B')
            ON CONFLICT (device_id) DO UPDATE SET token_hash = EXCLUDED.token_hash;
          SQL
          echo "SYNC_TOKEN_DEVICE_A=$TOKEN_A" >> "$GITHUB_ENV"
          echo "SYNC_TOKEN_DEVICE_B=$TOKEN_B" >> "$GITHUB_ENV"

      # setsid detaches the server from this step's shell, which exits as soon
      # as the step finishes. A bare "&" left it orphaned and its logs lost.
      - name: Start Phase 2 backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nex
          PORT: "4000"
          NEX_TEST_MODE: "1"
          NEX_AUTO_MIGRATE: "0"
          # A page small enough that the pagination case can force three pages
          # without pushing 1,500 notes over HTTP, and limits high enough that
          # the suite is not throttled by the thing it is not testing.
          SYNC_PAGE_SIZE: "50"
          SYNC_RATE_LIMIT: "100000"
          READ_RATE_LIMIT: "100000"
          # The limiter in front of the token lookup. Left at its default this
          # would throttle the matrix on the way in, before either of the two
          # above ever saw a request.
          PRE_AUTH_RATE_LIMIT: "100000"
        run: |
          setsid npx tsx src/index.ts > "$RUNNER_TEMP/backend.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health/ready | grep -q '"database":"up"'; then
              echo "backend ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::backend failed to become ready"
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 1
          done

      - name: Run mandatory sync matrix
        working-directory: packages/data
        env:
          RUN_SYNC_MATRIX: "1"
          SYNC_BASE_URL: http://127.0.0.1:4000
          # Must match the server's, so the pagination case knows how many
          # notes it takes to force a second page.
          SYNC_PAGE_SIZE: "50"
          SYNC_TOKEN_DEVICE_A: ${{ env.SYNC_TOKEN_DEVICE_A }}
          SYNC_TOKEN_DEVICE_B: ${{ env.SYNC_TOKEN_DEVICE_B }}
        run: |
          dart pub get
          dart test test/sync_matrix_test.dart

      - name: Backend log
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" || true

      - name: Stop backend
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true

  # Permanent Phase 3 proof (09-ai.md): packages/ai must be
  # deletable without breaking core/data/ui/client.
  #
  # The old version only checked apps/client and only rebuilt apps/client, which
  # made it close to a tautology: every AI contract the client consumes lives in
  # packages/core and cannot be deleted. It now asserts the real invariant and
  # rebuilds the whole downstream graph.
  #
  # ADR-031 added one deliberate exception: apps/client/lib/main_ai.dart (the
  # "ai" Android flavor's entry point) imports package:nex_ai/ directly, and
  # apps/client/pubspec.yaml lists nex_ai so that file compiles. Proving
  # deletability now means proving the *standard* flavor survives deleting
  # packages/ai, which needs main_ai.dart and the pubspec dependency line
  # removed too — both would otherwise reference the now-deleted package.
  ai-deletion-proof:
    name: packages/ai deletion proof (downstream graph still builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Assert nex_ai is only imported by packages/ai and the ai-flavor entry point
        run: |
          if grep -Rn --include='*.dart' "package:nex_ai/" apps packages --exclude-dir=ai \
              | grep -v '^apps/client/lib/main_ai\.dart:' | grep -q .; then
            echo "::error::only packages/ai and apps/client/lib/main_ai.dart may import package:nex_ai (09-ai.md, ADR-031)"
            exit 1
          fi

      # The deletion step below assumes this exact shape when it strips the
      # dependency with sed — checked here so a repin (a git/hosted source
      # instead of the local path) or reformatting fails loudly instead of
      # leaving that sed a silent no-op.
      - name: Assert apps/client's nex_ai dependency is still the local path
        run: |
          if ! grep -A1 '^  nex_ai:$' apps/client/pubspec.yaml \
              | grep -q '^    path: \.\./\.\./packages/ai$'; then
            echo "::error::apps/client's nex_ai dependency must stay 'path: ../../packages/ai' (09-ai.md, ADR-031)"
            exit 1
          fi

      - name: Delete packages/ai and its two integration points in apps/client
        run: |
          rm -rf packages/ai
          rm -f apps/client/lib/main_ai.dart
          sed -i '/^  nex_ai:$/,+1d' apps/client/pubspec.yaml

      # Resolve and analyze only. The claim being proved is that the graph
      # still *compiles* without packages/ai; re-running every suite and
      # building an APK again proves nothing the other jobs have not already
      # proved, and it was doing so for seven minutes — longer than the rest of
      # CI put together.
      - name: Downstream graph still resolves and analyzes
        run: |
          cd packages/core && dart pub get && dart analyze --fatal-infos && cd -
          cd packages/data && dart pub get && dart analyze --fatal-infos && cd -
          cd packages/ui   && flutter pub get && flutter analyze --fatal-infos && cd -
          cd apps/client   && flutter pub get && flutter analyze --fatal-infos

  # Single required check for branch protection.
  #
  # Protecting `main` by listing every job means the rule has to be edited each
  # time a job is added or renamed, and a job that is removed silently stops
  # being required. This one gates on all of them, so the branch rule needs
  # exactly one entry: "CI green".
  #
  # `always()` matters: without it this job is skipped when a dependency fails,
  # and a skipped required check reads as success.
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - dart-packages
      - core-boundary
      - flutter-ai-package
      - flutter-ui-package
      - client-android
      - client-windows
      - client-ios
      - backend
      - feedback-worker
      - merge-conformance
      - sync-integration
      - ai-deletion-proof
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          # client-ios only runs on push, so "skipped" is legitimate there.
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported: $result"; exit 1 ;;
            esac
          done
