name: Nex 2.6.12 one-time release dispatch

# This one-shot bridge triggers the existing signed release workflow when the
# fully CI-verified 2.6.12 PR merges. No change to signing, store or updater.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  checks: read
  actions: write

jobs:
  dispatch-v2612:
    name: Start official Nex 2.6.12 release once
    if: >-
      github.event.pull_request.number == 423 &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'fix/nex-2612-recurring-return-lag' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nex-2.6.12-one-time-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Verify merged version, notes, CI and absence of prior release
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          grep -qx 'version: 2.6.12' apps/client/pubspec.yaml
          grep -q '^## v2.6.12$' CHANGELOG.md
          grep -q '^## v2.6.12$' CHANGELOG.fa.md
          grep -q "const nexAppVersion = '2.6.12';" apps/client/lib/app_version.dart
          gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_HEAD/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "CI green" and .conclusion == "success") | .name' \
            | grep -Fx 'CI green'
          if gh release view v2.6.12 --repo sanyzrn/DbsNex-releases >/dev/null 2>&1; then
            echo "Public v2.6.12 already exists; do nothing."
            exit 0
          fi
          echo "Reviewed PR #423 is green; ready for official release."
      - name: Dispatch existing signed Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.6.12 --repo sanyzrn/DbsNex-releases >/dev/null 2>&1; then
            echo "Public v2.6.12 exists; skipping duplicate."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v2.6.12
          echo "Dispatched signed v2.6.12 release on main."
