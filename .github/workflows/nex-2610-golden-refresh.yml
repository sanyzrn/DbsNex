name: Nex 2.6.10 Dart formatting (temporary)
on:
  push:
    branches:
      - fix/nex-2610-card-marker-polish
permissions:
  contents: write
concurrency:
  group: nex-2610-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/nex-2610-card-marker-polish
          persist-credentials: true
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.7"
      - name: Format the changed lower badge widget
        run: dart format packages/ui/lib/widgets/note_card_collapsed.dart
      - name: Commit only canonical format changes
        run: |
          git add packages/ui/lib/widgets/note_card_collapsed.dart
          if git diff --cached --quiet; then
            echo "Already correctly formatted"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ui): canonical lower-arc Dart formatting"
          git push origin HEAD:refs/heads/fix/nex-2610-card-marker-polish
