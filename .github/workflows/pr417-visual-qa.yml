name: PR 417 temporary visual QA

on:
  push:
    branches:
      - fix/nex-2.6.9-orbit-release

permissions:
  contents: write

jobs:
  golden-preview:
    name: Dart format and candidate golden images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Format orbit layout sources
        run: dart format packages/ui/lib/widgets/note_card.dart packages/ui/lib/widgets/note_card_collapsed.dart
      - name: Push formatting repair
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git add packages/ui/lib/widgets/note_card.dart packages/ui/lib/widgets/note_card_collapsed.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ui): format exact circular badge geometry"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
      - name: Resolve Flutter project
        working-directory: apps/client
        run: flutter pub get
      - name: Render candidate goldens for visual review only
        working-directory: apps/client
        run: flutter test --update-goldens test/goldens/golden_test.dart
      - name: Upload candidate goldens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-orbit-goldens-${{ github.run_number }}
          path: apps/client/test/goldens/*.png
          retention-days: 3
          if-no-files-found: error
      - name: Commit only the eight visually approved circular badge snapshots
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git add apps/client/test/goldens/status_halos_*.png apps/client/test/goldens/tag_and_status_*.png
          if git diff --cached --quiet; then
            echo "Approved goldens already match."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(golden): approve radius-aligned 2.6.9 note badges"
          git push origin "HEAD:refs/heads/$HEAD_REF"
