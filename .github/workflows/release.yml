name: Release

# Builds a signed Android App Bundle + split APKs and a Windows Inno Setup
# installer, and attaches them to a GitHub Release. Triggered by version tags or
# manually.
#
# The release is published to RELEASES_REPO — a separate, public repo — not to
# this one. This repo is private; GitHub's release API and asset downloads both
# require authentication once a repo is private, and the in-app updater has no
# way to hold a credential for that without shipping a token inside the app
# that anyone could pull back out of it. A public releases-only repo needs no
# token in the client at all.
#
# One-time setup this depends on:
#   1. Create the public repo named in RELEASES_REPO below, with one commit in
#      it — a short README saying it holds build artifacts is enough. Not an
#      empty repo: a release has to tag a commit, and a repo with no commits
#      has no default branch for the tag to point at.
#   2. Generate a fine-grained PAT scoped to *only* that repo, with
#      Contents: Read and write — nothing else.
#   3. Add it to this (private) repo's secrets as RELEASES_REPO_TOKEN.
#
# On the "Source code (zip)" and "(tar.gz)" entries: GitHub attaches those to
# every release and offers no way to turn them off. Publishing to a separate
# repo is what makes them harmless — they are archives of RELEASES_REPO, which
# holds only that README, not of this repository. Keeping that repo to a single
# file is what keeps them a couple of hundred bytes of nothing rather than a
# copy of the source beside the installer.
#
# Required repo secrets (one-time; never commit the keystore):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, RELEASES_REPO_TOKEN

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, with or without the leading v (e.g. 0.2.1)"
        required: true

permissions:
  contents: write
  # Lets publish-release delete this run's own hand-off artifacts once the
  # Release exists — see the cleanup step at the end of that job. Deleting an
  # artifact is an Actions write, not a contents write.
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag push -> github.ref_name; manual run -> inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # The public repo the in-app updater actually checks — see the note at the
  # top of this file. Change this and UpdateChecker's default `repository`
  # together; the two have to agree, or the app looks in the wrong place.
  RELEASES_REPO: sanyzrn/DbsNex-releases

jobs:
  # The tag is the single source of truth for the version. Every number that
  # ends up in a build — build-name, Android versionCode, the installer, the
  # About screen — is derived from it here, so a release never depends on
  # remembering to edit a file first.
  #
  # This also fails loudly on a malformed tag. `v.0.2.0` matches the `v*.*.*`
  # trigger glob but strips to `.0.2.0`, which used to surface as a confusing
  # "does not match pubspec" error three steps later.
  version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      base: ${{ steps.parse.outputs.base }}
      tag: ${{ steps.parse.outputs.tag }}
      code: ${{ steps.parse.outputs.code }}
    steps:
      - id: parse
        run: |
          RAW="${{ env.RELEASE_TAG }}"
          # Accept both "0.2.1" and "v0.2.1"; normalise to one shape.
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a valid version tag."
            echo "::error::Expected vMAJOR.MINOR.PATCH, optionally with a pre-release suffix — for example v0.2.1 or v0.2.1-beta."
            echo "::error::Common slips: a dot after the v (v.0.2.1), a missing v, or a trailing space."
            exit 1
          fi
          BASE="${VERSION%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          # github.run_number is scoped to the workflow FILE: renaming or
          # recreating release.yml resets it to 1. Play requires versionCode to
          # increase strictly and forever, so it must come from the version.
          #
          # The x10000 spacing is not decoration — it is what keeps an in-place
          # update installable. Flutter adds an ABI offset to the versionCode of
          # every --split-per-abi APK (arm32 +1000, arm64 +2000, x86_64 +4000)
          # so that Play can tell the variants apart. Under the old
          # MA*1e6+MI*1e3+PA scheme consecutive versions were one apart, so a
          # split APK outranked the *next* several versions' universal APK:
          # v0.7.8-arm64 shipped as 9008, and v0.9.1-universal as 9001, which
          # Android refuses to install over it as a downgrade. That is exactly
          # what happened, and why 0.9.1 could only be installed by uninstalling
          # first. Ten thousand per patch release clears the 4000 ceiling with
          # room to spare, so any later version's universal APK still outranks
          # any earlier version's split.
          #
          # It also has to clear every code already installed in the wild. The
          # highest ever published is 11008 (v0.7.8, x86_64); the smallest this
          # can now produce is 9020000.
          if [ "$MI" -gt 99 ] || [ "$PA" -gt 99 ]; then
            echo "::error::minor and patch must each stay under 100 — the versionCode scheme packs them two digits wide."
            exit 1
          fi
          CODE=$(( (MA * 10000 + MI * 100 + PA) * 10000 ))
          {
            echo "version=$VERSION"
            echo "base=$BASE"
            echo "tag=v$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION base=$BASE tag=v$VERSION versionCode=$CODE"

  # A tag used to ship straight to a public Release without ever running
  # analyze, tests, or the backend suite: ci.yml triggers on branches, and tags
  # do not match branches.
  verify:
    name: Full verification suite
    uses: ./.github/workflows/ci.yml

  build-android:
    name: Android release bundle + APKs
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7

      # 21, not 17, and only as the JDK Gradle itself runs on — the app's
      # bytecode target is pinned to 17 in android/app/build.gradle.kts
      # (compileOptions + jvmTarget) and does not move with this, so the
      # shipped artifact is unchanged.
      #
      # Android Lint is compiled against Java 21 and calls List.removeLast(),
      # which only exists from 21 (SequencedCollection). On 17 it dies with
      # NoSuchMethodError mid-analysis, failing lintVitalAnalyzeRelease and
      # with it the whole release build. That task runs on release builds
      # only, which is why CI stayed green on its debug build while every
      # release failed here.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned in .fvmrc so a stable bump cannot silently change
          # the compiler, AGP defaults or the Android embedding mid-release.
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret missing — add it under Settings → Secrets and variables → Actions (see docs/06-development.md § Cutting a Release). Refusing to ship an unsigned/debug APK as a release artifact."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nex-release.keystore
          test -s android/app/nex-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=nex-release.keystore"
          } > android/key.properties
          test -s android/key.properties

      # Stamps the checkout rather than asking the author to have edited it.
      # The build already takes --build-name from the tag; this keeps the
      # version the *app* shows in About honest too.
      - name: Stamp the version from the tag
        run: |
          BASE="${{ needs.version.outputs.base }}"
          sed -i -E "s/^version: .*/version: $BASE/" pubspec.yaml
          sed -i -E "s/^const nexAppVersion = '.*';/const nexAppVersion = '$BASE';/" lib/app_version.dart
          grep -E '^version:' pubspec.yaml
          grep -E 'nexAppVersion' lib/app_version.dart

      - run: flutter pub get

      - name: Build App Bundle (Play) and split APKs (direct download)
        run: |
          # --flavor standard: required once flavorDimensions is defined
          # (ADR-031) — this release pipeline ships the AI-free flavor only,
          # same as it always has. The "ai" flavor has no release process yet.
          flutter build appbundle --release --flavor standard \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}
          flutter build apk --release --flavor standard --split-per-abi \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}
          # The universal APK is what the in-app updater downloads: it cannot
          # know the device's ABI before the download, and picking the wrong
          # split installs nothing. Bigger, but it is the one asset that is
          # always correct.
          flutter build apk --release --flavor standard \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}

      - name: Collect release assets
        run: |
          mkdir -p dist
          # Flavor-qualified output paths (ADR-031): Gradle nests these under
          # standardRelease/ and the Flutter tool inserts "-standard-" into
          # every flutter-apk filename once a flavor is set.
          cp build/app/outputs/bundle/standardRelease/app-standard-release.aab \
            "dist/Nex-${{ needs.version.outputs.version }}.aab"
          # ABI first, flavor second. The Flutter tool has two different naming
          # helpers — `_apkFilesFor` builds app-<flavor>-<abi>-<mode>.apk for
          # Gradle's own outputs/apk/ tree, and `listApkPaths` builds
          # app-<abi>-<flavor>-<mode>.apk for the flutter-apk/ directory this
          # step reads. Guessing the first order here matched nothing, and
          # because the copy was guarded by `[ -f ]` it failed silently: v0.9.1
          # published a universal APK and no splits at all, with a green build.
          # No guard now — a missing artifact fails the release.
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-standard-release.apk" \
              "dist/Nex-${{ needs.version.outputs.version }}-$abi.apk"
          done
          # The updater matches this asset by the "-universal.apk" suffix, so
          # the name is a contract, not a label.
          cp build/app/outputs/flutter-apk/app-standard-release.apk \
            "dist/Nex-${{ needs.version.outputs.version }}-universal.apk"
          ls -la dist
          # The bundle, three splits, the universal APK. Asserted rather than
          # assumed: shipping a release that is quietly missing the split the
          # updater asks for is how an update stops being installable at all.
          test "$(ls dist | wc -l)" -eq 5

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: apps/client/dist/*
          # Only ever consumed by publish-release's download-artifact step in
          # this same run — the actual long-lived distribution is the GitHub
          # Release in RELEASES_REPO, not this artifact. Left at the default
          # 90 days, every release run permanently added ~130MB (this plus
          # windows-installer) to the account's Actions storage quota until it
          # was exhausted.
          retention-days: 1

  build-windows:
    name: Windows Inno Setup installer
    needs: [version, verify]
    # PAUSED — Android-only focus. See the matching note in ci.yml.
    #
    # What this costs while paused: releases carry no Windows installer, so
    # anyone already running the Windows build stops being offered updates.
    # They are not broken — the updater simply finds no .exe asset and reports
    # no update available — but they stay on whatever version they have.
    #
    # Re-enabling takes two edits:
    #   1. delete this `if:` line
    #   2. add build-windows back to publish-release's `needs:` — a skipped
    #      dependency skips its dependents, so leaving it out is what keeps
    #      the publish running while this is paused
    # The installer itself needs no wiring: publish-release stages assets by
    # extension, so a .exe artifact is picked up as soon as one exists.
    if: false
    # Same pin as CI: windows-latest is Visual Studio 2026 since June 2026, and
    # Flutter 3.35.5 does not recognise it. A release must not build on an image
    # the verification pipeline never used.
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Stamp the version from the tag
        shell: pwsh
        run: |
          $base = "${{ needs.version.outputs.base }}"
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $base" |
            Set-Content pubspec.yaml
          (Get-Content lib/app_version.dart) -replace "^const nexAppVersion = '.*';", "const nexAppVersion = '$base';" |
            Set-Content lib/app_version.dart

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.base }} `
            --build-number=${{ needs.version.outputs.code }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup ISCC.exe not found at $iscc"
          }
          & $iscc "windows\installer\nex.iss" "/DAppVersion=$version"
          Get-ChildItem "windows\installer\Output\*.exe" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: apps/client/windows/installer/Output/*.exe
          # See the matching comment on the "android" artifact above.
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    # build-windows is deliberately absent while it is paused: a skipped job
    # in `needs` skips its dependents too, which would silently skip the
    # publish and produce a release run that "succeeds" without releasing
    # anything. Add it back when Windows returns.
    needs: [version, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # CHANGELOG.md's own top section — see that file for the convention —
      # replaces GitHub's auto-generated notes (a dump of every PR title and
      # commit, most of it meaningless to whoever is looking at "what's new"
      # on their phone) with the handful of lines a person actually wrote for
      # this release.
      - name: Extract this release's changelog section
        run: |
          # Take the section named after the tag being released, rather than
          # whichever section happens to sit at the top of the file.
          #
          # Position is the wrong key on both ends. CHANGELOG.md opens with a
          # "How this file is used" section written for contributors, which is
          # itself a '## ' heading — so reading "the first '## ' heading"
          # published that preamble as the release body, and sailed past the
          # Unreleased guard, because the heading it compared was never a
          # release heading. And the file's own convention keeps a fresh
          # "## Unreleased" on top for the next cycle, so "first release-shaped
          # heading" would then match that empty section on every subsequent
          # release and refuse to publish anything.
          #
          # The tag is unambiguous and already resolved, so ask for it by name.
          # This also turns "shipped a version nobody wrote release notes for"
          # into a failure rather than something you notice after publishing.
          want="## ${{ needs.version.outputs.tag }}"
          if ! grep -qxF "$want" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '$want' section. Rename '## Unreleased' to it in the commit that cuts this release (see that file's own 'How this file is used')."
            exit 1
          fi
          awk -v want="$want" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md's '$want' section is empty — nothing to publish."
            exit 1
          fi
          cat RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          # Somewhere known, rather than over the checked-out tree.
          path: artifacts

      # Collect by extension instead of trusting download-artifact's layout.
      #
      # This step had no `with:` at all and the two below globbed
      # `android/*.aab`, which assumed each artifact lands in a directory
      # named after itself. That was v4's behaviour; under v8 the files
      # arrived somewhere else, so the globs matched nothing, sha256sum was
      # handed its own unexpanded pattern, and the release died one step from
      # publishing after a nine-minute build. The layout is the action's to
      # change; the extensions are ours.
      #
      # It also means the Windows installer needs no wiring of its own: when
      # build-windows comes back its .exe is collected here like anything
      # else.
      - name: Stage release assets
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.aab' -o -name '*.apk' -o -name '*.exe' \) \
            -exec mv -t dist/ {} +
          ls -l dist
          # Publishing a release with no assets is worse than not publishing:
          # the updater would offer a version it cannot download.
          test -n "$(ls -A dist)"

      # The in-app updater downloads over a plain HTTPS GET with no signature
      # on the file itself — a hash it can check the download against closes
      # a corrupted-in-transit or substituted asset. Named for the filename
      # GitHub actually publishes the asset under (the flat basename, not
      # this job's `android/` / `windows-installer/` artifact subdirectories),
      # since that is what the client matches against `SHA256SUMS` by.
      - name: Generate SHA-256 checksums
        run: |
          # Whatever the staging step collected, named by basename — which is
          # what GitHub publishes each asset as, and so what the client
          # matches against.
          : > SHA256SUMS
          for f in dist/*; do
            sha256sum "$f" | awk -v name="$(basename "$f")" '{ print $1, name }' >> SHA256SUMS
          done
          cat SHA256SUMS
          # A release whose checksum file is empty would let the client accept
          # anything; fail loudly instead.
          test -s SHA256SUMS

      - name: Create GitHub Release
        # Third-party actions are pinned by commit SHA: this job holds
        # contents: write, so a compromised mutable tag would be able to push
        # to the repository.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # A different repo — the public one the in-app updater actually
          # checks (see the note at the top of this file) — which needs its
          # own token: the default GITHUB_TOKEN is scoped to the repo the
          # workflow runs in and cannot write anywhere else.
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          # The normalised tag, so a manual run started from a bare "0.2.1"
          # still creates and publishes v0.2.1.
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          # No target_commitish: that would be a commit SHA from *this* repo,
          # which the releases repo has no history for. The release is a
          # drop of build artifacts, not a snapshot of this repo's tree.
          # Manual verification runs (workflow_dispatch) publish as draft so a
          # test tag does not look like a production release.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
            SHA256SUMS

      # The artifacts were only ever a hand-off between jobs of this run; the
      # release above is the long-lived distribution. retention-days: 1 caps
      # the damage, but the runner error "Artifact storage quota has been hit"
      # (which fails the upload step and with it the whole release) is based
      # on usage recalculated every 6-12 hours, so even 1-day artifacts can
      # block a re-run started the same day. Delete them as soon as the
      # Release exists: a draft run already holds its files, and after a
      # published release nothing downloads these again.
      #
      # cleanup{} guards keep this from masking a real failure: deleting the
      # staging artifacts when the Release was never created would throw away
      # the only remaining copy of a 9-minute build.
      - name: Delete this run's staging artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json artifacts --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent
            echo "deleted staging artifact $id"
          done
