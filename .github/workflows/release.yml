name: Release

# Builds a signed Android App Bundle + split APKs and a Windows Inno Setup
# installer, and attaches them to a GitHub Release. Triggered by version tags or
# manually.
#
# The release is published to RELEASES_REPO — a separate, public repo — not to
# this one. This repo is private; GitHub's release API and asset downloads both
# require authentication once a repo is private, and the in-app updater has no
# way to hold a credential for that without shipping a token inside the app
# that anyone could pull back out of it. A public releases-only repo needs no
# token in the client at all.
#
# One-time setup this depends on:
#   1. Create the public repo named in RELEASES_REPO below, with one commit in
#      it — a short README saying it holds build artifacts is enough. Not an
#      empty repo: a release has to tag a commit, and a repo with no commits
#      has no default branch for the tag to point at.
#   2. Generate a fine-grained PAT scoped to *only* that repo, with
#      Contents: Read and write — nothing else.
#   3. Add it to this (private) repo's secrets as RELEASES_REPO_TOKEN.
#
# On the "Source code (zip)" and "(tar.gz)" entries: GitHub attaches those to
# every release and offers no way to turn them off. Publishing to a separate
# repo is what makes them harmless — they are archives of RELEASES_REPO, which
# holds only that README, not of this repository. Keeping that repo to a single
# file is what keeps them a couple of hundred bytes of nothing rather than a
# copy of the source beside the installer.
#
# Required repo secrets (one-time; never commit the keystore):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, RELEASES_REPO_TOKEN

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, with or without the leading v (e.g. 0.2.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag push -> github.ref_name; manual run -> inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # The public repo the in-app updater actually checks — see the note at the
  # top of this file. Change this and UpdateChecker's default `repository`
  # together; the two have to agree, or the app looks in the wrong place.
  RELEASES_REPO: sanyzrn/DbsNex-releases

jobs:
  # The tag is the single source of truth for the version. Every number that
  # ends up in a build — build-name, Android versionCode, the installer, the
  # About screen — is derived from it here, so a release never depends on
  # remembering to edit a file first.
  #
  # This also fails loudly on a malformed tag. `v.0.2.0` matches the `v*.*.*`
  # trigger glob but strips to `.0.2.0`, which used to surface as a confusing
  # "does not match pubspec" error three steps later.
  version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      base: ${{ steps.parse.outputs.base }}
      tag: ${{ steps.parse.outputs.tag }}
      code: ${{ steps.parse.outputs.code }}
    steps:
      - id: parse
        run: |
          RAW="${{ env.RELEASE_TAG }}"
          # Accept both "0.2.1" and "v0.2.1"; normalise to one shape.
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a valid version tag."
            echo "::error::Expected vMAJOR.MINOR.PATCH, optionally with a pre-release suffix — for example v0.2.1 or v0.2.1-beta."
            echo "::error::Common slips: a dot after the v (v.0.2.1), a missing v, or a trailing space."
            exit 1
          fi
          BASE="${VERSION%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          # github.run_number is scoped to the workflow FILE: renaming or
          # recreating release.yml resets it to 1. Play requires versionCode to
          # increase strictly and forever, so it must come from the version.
          CODE=$(( MA * 1000000 + MI * 1000 + PA ))
          {
            echo "version=$VERSION"
            echo "base=$BASE"
            echo "tag=v$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION base=$BASE tag=v$VERSION versionCode=$CODE"

  # A tag used to ship straight to a public Release without ever running
  # analyze, tests, or the backend suite: ci.yml triggers on branches, and tags
  # do not match branches.
  verify:
    name: Full verification suite
    uses: ./.github/workflows/ci.yml

  build-android:
    name: Android release bundle + APKs
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned in .fvmrc so a stable bump cannot silently change
          # the compiler, AGP defaults or the Android embedding mid-release.
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret missing — add it under Settings → Secrets and variables → Actions (see docs/06-development.md § Cutting a Release). Refusing to ship an unsigned/debug APK as a release artifact."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nex-release.keystore
          test -s android/app/nex-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=nex-release.keystore"
          } > android/key.properties
          test -s android/key.properties

      # Stamps the checkout rather than asking the author to have edited it.
      # The build already takes --build-name from the tag; this keeps the
      # version the *app* shows in About honest too.
      - name: Stamp the version from the tag
        run: |
          BASE="${{ needs.version.outputs.base }}"
          sed -i -E "s/^version: .*/version: $BASE/" pubspec.yaml
          sed -i -E "s/^const nexAppVersion = '.*';/const nexAppVersion = '$BASE';/" lib/app_version.dart
          grep -E '^version:' pubspec.yaml
          grep -E 'nexAppVersion' lib/app_version.dart

      - run: flutter pub get

      - name: Build App Bundle (Play) and split APKs (direct download)
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}
          flutter build apk --release --split-per-abi \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}
          # The universal APK is what the in-app updater downloads: it cannot
          # know the device's ABI before the download, and picking the wrong
          # split installs nothing. Bigger, but it is the one asset that is
          # always correct.
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.base }} \
            --build-number=${{ needs.version.outputs.code }}

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/Nex-${{ needs.version.outputs.version }}.aab"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$src" ] && cp "$src" "dist/Nex-${{ needs.version.outputs.version }}-$abi.apk"
          done
          # The updater matches this asset by the "-universal.apk" suffix, so
          # the name is a contract, not a label.
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Nex-${{ needs.version.outputs.version }}-universal.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/client/dist/*

  build-windows:
    name: Windows Inno Setup installer
    needs: [version, verify]
    # Same pin as CI: windows-latest is Visual Studio 2026 since June 2026, and
    # Flutter 3.35.5 does not recognise it. A release must not build on an image
    # the verification pipeline never used.
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Stamp the version from the tag
        shell: pwsh
        run: |
          $base = "${{ needs.version.outputs.base }}"
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $base" |
            Set-Content pubspec.yaml
          (Get-Content lib/app_version.dart) -replace "^const nexAppVersion = '.*';", "const nexAppVersion = '$base';" |
            Set-Content lib/app_version.dart

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.base }} `
            --build-number=${{ needs.version.outputs.code }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup ISCC.exe not found at $iscc"
          }
          & $iscc "windows\installer\nex.iss" "/DAppVersion=$version"
          Get-ChildItem "windows\installer\Output\*.exe" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/client/windows/installer/Output/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md's own top section — see that file for the convention —
      # replaces GitHub's auto-generated notes (a dump of every PR title and
      # commit, most of it meaningless to whoever is looking at "what's new"
      # on their phone) with the handful of lines a person actually wrote for
      # this release.
      - name: Extract this release's changelog section
        run: |
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## ' section to publish."
            exit 1
          fi
          if [ "$heading" = "## Unreleased" ]; then
            echo "::error::CHANGELOG.md's top section is still 'Unreleased' — rename it to ${{ needs.version.outputs.tag }} in the commit that cuts this release."
            exit 1
          fi
          awk '/^## /{if (found) exit; found=1; next} found' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f -printf '%p %s bytes\n'

      # The in-app updater downloads over a plain HTTPS GET with no signature
      # on the file itself — a hash it can check the download against closes
      # a corrupted-in-transit or substituted asset. Named for the filename
      # GitHub actually publishes the asset under (the flat basename, not
      # this job's `android/` / `windows-installer/` artifact subdirectories),
      # since that is what the client matches against `SHA256SUMS` by.
      - name: Generate SHA-256 checksums
        run: |
          : > SHA256SUMS
          for f in android/*.aab android/*.apk windows-installer/*.exe; do
            sha256sum "$f" | awk -v name="$(basename "$f")" '{ print $1, name }' >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create GitHub Release
        # Third-party actions are pinned by commit SHA: this job holds
        # contents: write, so a compromised mutable tag would be able to push
        # to the repository.
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          # A different repo — the public one the in-app updater actually
          # checks (see the note at the top of this file) — which needs its
          # own token: the default GITHUB_TOKEN is scoped to the repo the
          # workflow runs in and cannot write anywhere else.
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          # The normalised tag, so a manual run started from a bare "0.2.1"
          # still creates and publishes v0.2.1.
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          # No target_commitish: that would be a commit SHA from *this* repo,
          # which the releases repo has no history for. The release is a
          # drop of build artifacts, not a snapshot of this repo's tree.
          # Manual verification runs (workflow_dispatch) publish as draft so a
          # test tag does not look like a production release.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: RELEASE_NOTES.md
          files: |
            android/*.aab
            android/*.apk
            windows-installer/*.exe
            SHA256SUMS
