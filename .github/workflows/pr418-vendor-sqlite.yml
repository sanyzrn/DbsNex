name: PR 418 one-time verified SQLite source import

on:
  push:
    branches:
      - fix/nex269-reminder-visibility

permissions:
  contents: write

jobs:
  import-amalgamation:
    name: Verify upstream SQLite 3.54.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch and verify exact official SQLite release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request
          from zipfile import ZipFile
          from io import BytesIO
          from hashlib import sha3_256

          # SHA3 values published by sqlite.org for release 3.54.1 (2026-10-16).
          expected_zip = '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30'
          expected_source = 'e2b869d3003b33c942b7dd7063604fbc53553e1b66609570df39b9b7b558ee81'
          archive = None
          for host in ('www.sqlite.org', 'www2.sqlite.org', 'www3.sqlite.org'):
              url = f'https://{host}/2026/sqlite-amalgamation-3540100.zip'
              try:
                  with urlopen(Request(url, headers={'User-Agent': 'DbsNex-build/1.0'}), timeout=25) as response:
                      candidate = response.read()
                  if sha3_256(candidate).hexdigest() != expected_zip:
                      print('Skipping upstream mirror with incorrect archive checksum:', host)
                      continue
                  archive = candidate
                  break
              except Exception as error:
                  print('Upstream mirror unavailable:', host, str(error)[:170])
          if archive is None:
              raise SystemExit('Verified SQLite amalgamation unavailable from all official mirrors')
          with ZipFile(BytesIO(archive)) as z:
              filename = 'sqlite-amalgamation-3540100/sqlite3.c'
              source = z.read(filename)
          if sha3_256(source).hexdigest() != expected_source:
              raise SystemExit('SQLite C source checksum differs from official 3.54.1 release notes')
          dst = Path('apps/client/third_party/sqlite/sqlite3.c')
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_bytes(source)
          print('Verified original sqlite3.c:', dst, len(source), 'bytes')
          PY
      - name: Commit verified public-domain source
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git add apps/client/third_party/sqlite/sqlite3.c
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: vendor verified SQLite 3.54.1 amalgamation for Android"
          git push origin "HEAD:refs/heads/$HEAD_REF"
