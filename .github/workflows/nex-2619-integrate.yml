name: Nex 2.6.19 audit patch integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.nex-2.6.19-performance.patch'
      - '.github/workflows/nex-2619-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/nex-2.6.19-index-and-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 2
      - name: Validate exact patch and apply
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = "2.6.18"
          echo '0a16b5617248cf0391bd17c7cb2914542327d63a9b1634fb20f44e0df812ec7b  .nex-2.6.19-performance.patch' | sha256sum -c -
          git apply --check .nex-2.6.19-performance.patch
          git apply .nex-2.6.19-performance.patch
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = "2.6.19"
      - name: Make index migration and downgrade guard atomic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/data/lib/schema/database.dart')
          s = path.read_text()
          marker = """      db.execute(
                  "INSERT OR REPLACE INTO nex_meta (key, value) "
                  "VALUES ('fts_rowid_aligned', ?)",
                  [DateTime.now().toUtc().toIso8601String()],
                );
                db.execute('COMMIT');"""
          # The migration and its version guard must commit together.
          assert s.count(marker) == 1, 'Unexpected schema alignment implementation'
          replacement = marker.replace(
              "      db.execute('COMMIT');",
              """      // Stamp inside the same transaction as the re-key. If the app is
                // interrupted, an older APK must never see a re-keyed FTS index
                // still labelled schema 2.
                db.execute('PRAGMA user_version = $schemaVersion');
                db.execute('COMMIT');""",
          )
          s = s.replace(marker, replacement, 1)
          path.write_text(s)
          PY
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - name: Format and verify changed Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format packages/data/lib/schema/database.dart packages/data/lib/repositories/note_repository.dart packages/data/lib/repositories/scheduled_note_repository.dart packages/data/test/fts_rowid_alignment_test.dart apps/client/lib/app_version.dart
          git diff --check
          test "$(grep -c 'fts_rowid_aligned' packages/data/lib/schema/database.dart)" -ge 2
          test "$(grep -c 'PRAGMA user_version = \$schemaVersion' packages/data/lib/schema/database.dart)" -ge 2
      - name: Commit integrated patch to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .nex-2.6.19-performance.patch .github/workflows/nex-2619-integrate.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "perf: speed up Nex 2.6.19 FTS writes and index repair"
          git push origin HEAD:perf/nex-2.6.19-index-and-migration
