name: Temporary PR 418 sqlite3 lock refresh

on:
  push:
    branches:
      - fix/nex269-reminder-visibility

permissions:
  contents: write

jobs:
  refresh-locks:
    name: Refresh sqlite3 locks with pinned Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Resolve workspaces with 3.8.0 pinned in data and client
        run: |
          (cd packages/data && dart pub get)
          (cd packages/ai && flutter pub get)
          (cd apps/client && flutter pub get)
      - name: Verify every updated lock selects sqlite3 3.8.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in (
              Path('packages/data/pubspec.lock'),
              Path('packages/ai/pubspec.lock'),
              Path('apps/client/pubspec.lock'),
          ):
              source = path.read_text()
              match = re.search(r'  sqlite3:\n(?:(?!\n  [^ ]).)*?    version: "([^"]+)"', source, re.S)
              assert match and match.group(1) == '3.8.0', (str(path), match.group(1) if match else 'missing')
              print(f'{path}: sqlite3 {match.group(1)}')
          PY
      - name: Commit real resolver output, no manual hash editing
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git add packages/data/pubspec.lock packages/ai/pubspec.lock apps/client/pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: resolve verified sqlite3 3.8.0 lockfiles"
          git push origin "HEAD:refs/heads/$HEAD_REF"
