name: Nex lower badge rim reference refresh (temporary)
on:
  push:
    branches: [fix/nex-2610-status-center-on-rim]
permissions:
  contents: write
jobs:
  update-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/nex-2610-status-center-on-rim
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Refresh only the eight golden status-card references
        working-directory: apps/client
        run: |
          flutter test --update-goldens test/goldens/golden_test.dart --plain-name "centred content and tiny status halos"
          flutter test --update-goldens test/goldens/golden_test.dart --plain-name "three tags and all lower badges"
      - name: Commit only the eight intended reference images
        run: |
          git add apps/client/test/goldens/status_halos_{ltr,rtl}_{light,dark}.png
          git add apps/client/test/goldens/tag_and_status_{ltr,rtl}_{light,dark}.png
          if git diff --cached --quiet; then
            echo "Reference images already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(goldens): update only lower badge orbit references"
          git push origin HEAD:refs/heads/fix/nex-2610-status-center-on-rim
