name: Polish stage checks

on:
  push:
    branches:
      - codex/2.0-polish

permissions:
  contents: read

jobs:
  flutter-stage:
    name: UI tests and Android analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: UI dependencies
        run: cd packages/ui && flutter pub get
      - name: UI tests
        run: cd packages/ui && flutter test
      - name: Android app dependencies
        run: cd apps/client && flutter pub get
      - name: Android app analyze
        run: cd apps/client && flutter analyze
      - name: Android app tests
        run: cd apps/client && flutter test
