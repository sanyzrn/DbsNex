name: Integrate Nex 2.6.20 assistant audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.nex-2.6.20-assistant.patch'
      - '.github/workflows/nex-2620-assistant-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/nex-2.6.20-assistant-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact audit patch and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = '2.6.19'
          echo 'eac53dd3b4189956142d3bbe04b6c88e8f5617f2b407dbd1451d69ab359c0e2b  .nex-2.6.20-assistant.patch' | sha256sum -c -
          git apply --check .nex-2.6.20-assistant.patch
          git apply .nex-2.6.20-assistant.patch
          git diff --check
      - name: Bump to Nex 2.6.20 and publish bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('apps/client/pubspec.yaml')
          src = version.read_text()
          assert src.count('version: 2.6.19') == 1
          version.write_text(src.replace('version: 2.6.19', 'version: 2.6.20', 1))

          v = Path('apps/client/lib/app_version.dart')
          src = v.read_text()
          assert src.count("const nexAppVersion = '2.6.19';") == 1
          v.write_text(src.replace("const nexAppVersion = '2.6.19';", "const nexAppVersion = '2.6.20';", 1))

          en = """## v2.6.20

          - **Important notes reach Smart Summary.** Older urgent notes and reminders are considered even when they fall outside the timeline's newest 200 notes.
          - **More reliable daily brief.** Pull-to-refresh is honoured during automatic updates, unnecessary refreshes are eliminated, and long notes no longer flood the greeting request.
          - **Stop an on-device assistant answer.** The Stop button now works with the phone's own model too; late results are discarded and the question remains available to retry.
          - **Clearer note names in assistant chat.** Captioned photos, recordings and files appear by their own captions in the conversation and source chips.
          - **Useful error messages.** Follow-up searches distinguish timeouts, connection issues, rate limits and rejected keys instead of a generic failed reply.

          """
          fa = """## v2.6.20

          - **یادداشت‌های مهم از خلاصه جا نمی‌مانند.** یادداشت‌های فوری و یادآورهای قدیمی، حتی بیرون از ۲۰۰ یادداشت اخیر تایم‌لاین، در خلاصه هوشمند بررسی می‌شوند.
          - **خلاصه هوشمند دقیق‌تر و روان‌تر.** تازه‌سازی دستی هنگام تولید خودکار هم عمل می‌کند، پردازش تکراری کاهش یافته و متن بلند بی‌دلیل برای خوش‌آمدگویی ارسال نمی‌شود.
          - **توقف پاسخ دستیار با مدل گوشی.** دکمهٔ توقف برای مدل محلی هم فعال است؛ پاسخ دیرهنگام نمایش داده نمی‌شود و امکان تلاش مجدد باقی می‌ماند.
          - **نام‌گذاری بهتر یادداشت‌ها در دستیار.** عکس‌ها، صداها و فایل‌های دارای کپشن، با متن کپشن در گفتگو و منبع پاسخ نشان داده می‌شوند.
          - **خطاهای قابل‌فهم‌تر دستیار.** خطای جست‌وجوی تکمیلی به‌جای پیام عمومی، علت‌هایی مثل قطعی شبکه، پایان زمان انتظار، محدودیت درخواست و کلید نامعتبر را مشخص می‌کند.

          """
          for name, section in [
              ('CHANGELOG.md', en),
              ('apps/client/assets/CHANGELOG.md', en),
              ('CHANGELOG.fa.md', fa),
              ('apps/client/assets/CHANGELOG.fa.md', fa),
          ]:
              p = Path(name)
              text = p.read_text()
              assert text.count('## v2.6.19') == 1 and '## v2.6.20' not in text, name
              p.write_text(text.replace('## v2.6.19', section + '## v2.6.19', 1))

          p = Path('docs/development/CHANGELOG.md')
          text = p.read_text()
          assert text.count('## Unreleased\n\n') == 1
          assert text.count('- Whole-app performance review with root-cause fixes, released as v2.6.19:') == 1
          text = text.replace('## Unreleased\n\n', '## Unreleased\n\n## v2.6.20\n\n', 1)
          text = text.replace('- Whole-app performance review with root-cause fixes, released as v2.6.19:', '## v2.6.19\n\n- Whole-app performance review with root-cause fixes, released as v2.6.19:', 1)
          p.write_text(text)
          PY
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - name: Format only touched Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/client/lib/app_version.dart apps/client/lib/widgets/ai_chat/chat_context.dart apps/client/lib/widgets/ai_chat/chat_sending.dart apps/client/lib/widgets/ai_chat/chat_thread.dart apps/client/lib/widgets/ai_chat_sheet.dart apps/client/test/assistant_deep_review_test.dart
          git diff --check
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = '2.6.20'
          test "$(grep -c '^## v2.6.20$' CHANGELOG.md)" = 1
          test "$(grep -c '^## v2.6.20$' CHANGELOG.fa.md)" = 1
      - name: Commit real Nex 2.6.20 sources and remove temporary staging
        shell: bash
        run: |
          set -euo pipefail
          rm .nex-2.6.20-assistant.patch .github/workflows/nex-2620-assistant-integrate.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: Nex 2.6.20 assistant reliability and Smart Summary release notes'
          git push origin HEAD:feat/nex-2.6.20-assistant-review
