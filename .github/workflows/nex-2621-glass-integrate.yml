name: Integrate Nex 2.6.21 Liquid Glass

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.nex-2.6.21-glass.patch'
      - '.github/workflows/nex-2621-glass-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/nex-2.6.21-liquid-glass-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Validate exact reviewed patch and Nex 2.6.20 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = '2.6.20'
          echo '8a226deb77c8ad195d5a71265003647713cb1bbb43e0dfb5b5b8af774b70223c  .nex-2.6.21-glass.patch' | sha256sum -c -
          git apply --check .nex-2.6.21-glass.patch
          git apply .nex-2.6.21-glass.patch
          git diff --check
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - name: Format changed Dart files and verify release invariants
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/client/lib/app_version.dart \
            apps/client/lib/platform/appearance_mode.dart \
            apps/client/lib/platform/minimal_theme.dart \
            apps/client/lib/platform/preferences/appearance_preferences.dart \
            apps/client/lib/screens/settings/settings_appearance.dart \
            apps/client/test/appearance_modes_test.dart \
            apps/client/test/bottom_bar_test.dart \
            apps/client/test/glass_capture_test.dart \
            apps/client/test/still_theme_test.dart \
            apps/client/test/timeline_motion_test.dart \
            packages/ui/lib/tokens/nex_appearance.dart \
            packages/ui/lib/tokens/nex_tokens.dart \
            packages/ui/test/nex_appearance_test.dart
          git diff --check
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = '2.6.21'
          grep -q "const nexAppVersion = '2.6.21'" apps/client/lib/app_version.dart
          test "$(grep -c '^## v2.6.21$' CHANGELOG.md)" = 1
          test "$(grep -c '^## v2.6.21$' CHANGELOG.fa.md)" = 1
          test "$(grep -c '^## v2.6.21$' apps/client/assets/CHANGELOG.md)" = 1
          test "$(grep -c '^## v2.6.21$' apps/client/assets/CHANGELOG.fa.md)" = 1
          grep -q 'const nexLiquidGlassAvailable = true;' apps/client/lib/platform/appearance_mode.dart
          grep -q 'const nexThemePresetsAvailable = false;' apps/client/lib/platform/appearance_mode.dart
      - name: Commit sources and remove staging patch
        shell: bash
        run: |
          set -euo pipefail
          rm .nex-2.6.21-glass.patch .github/workflows/nex-2621-glass-integrate.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: rebuild opt-in Liquid Glass for Nex 2.6.21'
          git push origin HEAD:feat/nex-2.6.21-liquid-glass-rebuild
