# Builds the "ai" flavor so it can be installed on a real phone.
#
# Nothing else produces this artifact. `release.yml` ships the standard flavor
# only, and CI builds a standard *debug* APK — so until now the ai flavor had
# never been assembled anywhere, by anyone. That is the whole reason the last
# on-device test never happened: there was no APK to install, and the absence
# looked like an installation failure.
#
# Manual only. This is a testing tool, not part of the release path, and the
# model it downloads is 2 GB of someone's connection.
name: AI flavor test build

on:
  workflow_dispatch:

jobs:
  build:
    name: ai flavor APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7

      # 21 for Gradle's own JVM, matching release.yml — Android Lint's
      # release-only task needs SequencedCollection and dies on 17.
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret missing — see docs/06-development.md § Cutting a Release."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nex-release.keystore
          test -s android/app/nex-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=nex-release.keystore"
          } > android/key.properties
          test -s android/key.properties

      # Without this the APK carries pubspec's placeholder 0.2.0, whose
      # versionCode is far below the installed release's — and Android refuses
      # an install that would go backwards. That is why the last test build
      # could only be installed by deleting every copy of the app first. The
      # version comes from the newest section of the CHANGELOG and uses
      # release.yml's own formula, so a test build ranks exactly where the
      # release it is testing will.
      - name: Version this build like the release it is testing
        id: version
        run: |
          BASE=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' ../../CHANGELOG.md | sed 's/^## v//')
          if [ -z "$BASE" ]; then
            echo "::error::no '## vX.Y.Z' section found in CHANGELOG.md"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$BASE"
          CODE=$(( (MA * 10000 + MI * 100 + PA) * 10000 ))
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "building $BASE (versionCode $CODE)"

      - run: flutter pub get

      # --release, not --debug: the point is to measure how the model behaves,
      # and a debug build runs Dart under the JIT with assertions on. Inference
      # itself is native and would be unaffected, but everything around it —
      # scroll, rebuilds, the chat sheet — would be measured wrong.
      #
      # --target lib/main_ai.dart is what makes this the ai flavor in fact and
      # not just in name: the Dart entry point is what binds LiteRtChatAdapter
      # (ADR-031). Both flavors share one applicationId on purpose — the suffix
      # was removed so a shipped build can update over itself; reintroducing
      # one is how an update stops installing (see 0.9.1).
      #
      # arm64 only, because that is the only ABI LiteRT-LM ships native code
      # for; LocalAi refuses to offer the download on anything else, so a
      # 32-bit slice of this APK would be an installable app with the feature
      # permanently unavailable.
      - name: Build ai flavor APK
        run: |
          flutter build apk --release \
            --flavor ai \
            --target lib/main_ai.dart \
            --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.base }} \
            --build-number=${{ steps.version.outputs.code }}

      # Flavor-qualified path, same wrinkle release.yml documents: Gradle nests
      # under aiRelease/ and the Flutter tool copies to flutter-apk/ with the
      # flavor spliced into the filename.
      - name: Collect the APK
        run: |
          mkdir -p dist
          # Found rather than named. The Flutter tool has two naming helpers
          # that disagree about where the flavor goes in the filename, and a
          # hardcoded path that guesses wrong fails after a 20-minute build
          # with nothing but "No such file". One APK is expected; more than one
          # means an assumption here is stale and is worth stopping for.
          mapfile -t apks < <(find build/app/outputs/flutter-apk -name '*.apk')
          printf '%s\n' "${apks[@]}"
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" dist/Nex-ai-arm64.apk
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: nex-ai-arm64-apk
          path: apps/client/dist/Nex-ai-arm64.apk
          # Long enough to be useful across a few days of testing, short
          # enough that a 100 MB debug artifact is not kept forever.
          retention-days: 14
