name: Nex 2.6.18 audit patch integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.nex-2.6.18-audit.patch'
      - '.github/workflows/nex-2618-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/nex-2.6.18-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 2
      - name: Verify patch and apply atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' apps/client/pubspec.yaml)" = "2.6.17"
          printf '1eafc7e4be994eb9464f4d04b4a8783da20f4a44edbbc125e5b02e5bd6fc023d  .nex-2.6.18-audit.patch\n' | sha256sum --check -
          git apply --check --binary .nex-2.6.18-audit.patch
          git apply --binary .nex-2.6.18-audit.patch
      - name: Set release metadata and bilingual release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/client/pubspec.yaml')
          s = path.read_text()
          assert s.count('version: 2.6.17') == 1
          path.write_text(s.replace('version: 2.6.17', 'version: 2.6.18', 1))

          path = Path('apps/client/lib/app_version.dart')
          s = path.read_text()
          assert s.count("nexAppVersion = '2.6.17'") == 1
          path.write_text(s.replace("nexAppVersion = '2.6.17'", "nexAppVersion = '2.6.18'", 1))

          sections = {
            'CHANGELOG.md': """## v2.6.18

          - **More readable surfaces.** Stronger contrast for vault bank cards, banners, module icons, tags, switches and urgent markers across Light, Dark and Night.
          - **Better Persian typography.** More comfortable line height, legible counters and consistently sized attachment badges.
          - **Quieter motion when requested.** Reduced-motion settings now apply to pages, sheets, camera, onboarding and loading indicators.
          - **Clearer, gentler feedback.** Unified touch feedback for reminders, checklists and switches; faster banner exits, smoother filters and more efficient reminder-bell animation.

          """,
            'CHANGELOG.fa.md': """## v2.6.18

          - **خوانایی بیشتر در همهٔ تم‌ها.** کنتراست کارت‌های گاوصندوق، پیام‌ها، آیکون ماژول‌ها، تگ‌ها، سوییچ‌ها و نشان فوری بهتر شده است.
          - **متن فارسی خواناتر.** فاصلهٔ خطوط مناسب‌تر و اندازهٔ شمارنده‌ها و نشان‌های پیوست یکدست شده است.
          - **رعایت کاهش حرکت.** تنظیم کاهش انیمیشن گوشی در صفحه‌ها، پنجره‌ها، دوربین، راه‌اندازی اولیه و نشانگرهای بارگذاری اعمال می‌شود.
          - **بازخورد و حرکت هماهنگ‌تر.** لرزش یادآورها، چک‌لیست و سوییچ‌ها هماهنگ‌تر و خروج پیام‌ها، تغییر فیلتر و انیمیشن زنگوله روان‌تر شده است.

          """
          }
          for name, section in sections.items():
            path = Path(name)
            value = path.read_text()
            assert '## v2.6.18' not in value
            assert '## v2.6.17' in value
            value = value.replace('## v2.6.17', section + '## v2.6.17', 1)
            path.write_text(value)
            Path('apps/client/assets', name).write_text(value)

          assert Path('CHANGELOG.md').read_bytes() == Path('apps/client/assets/CHANGELOG.md').read_bytes()
          assert Path('CHANGELOG.fa.md').read_bytes() == Path('apps/client/assets/CHANGELOG.fa.md').read_bytes()
          PY
          git diff --check
      - name: Commit reviewed integration on PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .nex-2.6.18-audit.patch .github/workflows/nex-2618-integrate.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix: integrate audited Nex 2.6.18 visual and motion changes"
          git push origin HEAD:fix/nex-2.6.18-audit
