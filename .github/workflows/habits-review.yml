name: Habits visual review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habits-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/client
      - name: Habits regression tests and bilingual screenshots
        run: flutter test --dart-define=NEX_CAPTURE=build/habits-review test/modules/habits
        working-directory: apps/client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: habits-review
          path: apps/client/build/habits-review
          retention-days: 7
