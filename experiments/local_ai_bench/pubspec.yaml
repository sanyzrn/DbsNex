name: local_ai_bench
description: >-
  Throwaway feasibility harness for Phase 0 of the offline-AI roadmap
  (docs/09-ai.md). A standalone project on purpose: apps/client and every
  package under packages/ are gated by CI to never depend on nex_ai directly
  (see the "packages/ai deletion proof" job) — this lives outside both, so
  the experiment can wire up nex_ai freely without touching that guarantee.
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  nex_ai:
    path: ../../packages/ai

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
