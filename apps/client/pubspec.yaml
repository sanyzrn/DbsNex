name: nex_client
description: >-
  Nex client. A single Flutter app target that builds to Android, Windows and
  (later) iOS — see ADR-024.
publish_to: "none"
version: 0.1.1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  intl: any
  nex_core:
    path: ../../packages/core
  nex_ai:
    path: ../../packages/ai
  nex_ui:
    path: ../../packages/ui
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.0.0
  shared_preferences: ^2.3.3
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
