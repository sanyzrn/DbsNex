name: nex_client
description: >-
  Nex client. A single Flutter app target that builds to Android, Windows and
  (later) iOS — see ADR-024. Phase 0: empty screen only.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  nex_core:
    path: ../../packages/core
  nex_ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
