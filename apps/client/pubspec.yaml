name: nex_client
description: >-
  Nex client. A single Flutter app target that builds to Android, Windows and
  (later) iOS — see ADR-024.
publish_to: "none"
version: 1.3.2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Both already resolved transitively; declared directly because
  # documents/docx_markdown.dart imports them. A `.docx` is a zip of XML, so
  # reading one needs an unzip and a parser, and this is the package that has
  # them in its closure already — see the note in that file about why the
  # reader is not in packages/core with the other readers.
  archive: ^4.0.9
  xml: ^6.6.1
  file_selector: ^1.0.3
  # The in-app updater: one GET to the GitHub releases API when the user
  # asks, plus the streamed download of the installer.
  http: ^1.2.2
  # Verifies a downloaded installer against the release's SHA256SUMS asset.
  # Already resolved transitively (http depends on it); declared directly
  # because app_update.dart now imports it.
  crypto: ^3.0.6
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  # Crop UI right after a capture. Pure Dart — no native platform code — so
  # it works uniformly on every target this app builds for, unlike
  # image_cropper, which has no Windows implementation at all.
  crop_your_image: ^2.0.0
  # Rotates a photo's raw bytes before crop_your_image ever sees them — it has
  # no rotation API of its own. Already resolved transitively (crop_your_image
  # depends on it); declared directly because photo_crop_screen.dart now
  # imports it too.
  image: ^4.3.0
  # Pinned to the version flutter_localizations resolves against on 3.35.x.
  # "any" delegated the constraint entirely to whatever Flutter stable was
  # installed at build time.
  intl: ^0.20.2
  meta: ^1.16.0
  just_audio: ^0.10.0
  # Endorses the Windows implementation. Without it every playback call throws
  # MissingPluginException on a first-class v1 target.
  just_audio_windows: ^0.2.2
  # Only imported by lib/main_ai.dart, the "ai" Android flavor's entry
  # point (ADR-031). Every other file in this app must not import
  # package:nex_ai/ — CI's ai-deletion-proof job enforces this.
  nex_ai:
    path: ../../packages/ai
  # Declared explicitly: the app is the composition root and owns the SQLite
  # database. It used to arrive silently through nex_core's re-export.
  nex_core:
    path: ../../packages/core
  nex_data:
    path: ../../packages/data
  nex_ui:
    path: ../../packages/ui
  # Hands a note's media to the OS the way a file manager does: the default
  # handler opens it, or the system asks which app should.
  #
  # Android and iOS only — its pubspec declares no other platform — so every
  # desktop open goes through url_launcher instead. See platform/file_opener.
  open_filex: ^4.7.0
  path: ^1.9.1
  # The desktop half of "open this file with whatever handles it". Its Windows
  # implementation is ShellExecute, which is also the right way to launch the
  # update installer: it is what raises the UAC prompt.
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  record: ^6.1.1
  # The platform share sheet for file, photo and voice notes.
  share_plus: ^12.0.2
  shared_preferences: ^2.3.3
  # AI provider API keys only — everything else stays in shared_preferences.
  # Android Keystore (EncryptedSharedPreferences) / Windows DPAPI, so a paid
  # third-party credential is not sitting in a plaintext XML or JSON file
  # anyone with ADB or filesystem access to the device can read.
  flutter_secure_storage: ^10.3.1
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.28
  uuid: ^4.5.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  # Answers what `tz.local` should be. Without it the timezone database is
  # loaded and never pointed at a zone, so `tz.local` stays UTC — which makes
  # every wall-clock schedule (the daily nudge, and any repeat matched on the
  # time of day) fire at the wrong hour by the device's offset.
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Only for test/flutter_test_config.dart, to register the in-memory fake
  # flutter_secure_storage ships for exactly this: no plugin is registered
  # under flutter_test, so every test touching NexPreferences would otherwise
  # hit a real platform channel that does not exist there.
  flutter_secure_storage_platform_interface: ^2.0.1
  # Only for about_screen_test.dart's fake, for the same reason: no plugin is
  # registered under flutter_test for getApplicationSupportDirectory either.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    # Bundled rather than fetched: a separate releases repo may have no
    # history published yet, and the changelog screen should never depend on
    # a network round trip to show what shipped.
    #
    # A copy, not the root CHANGELOG.md via a `../../` path: that was tried
    # first and looked fine under `flutter test`, whose asset resolution
    # reads straight off disk — but a real `flutter build` records a
    # `..`-escaping asset key in AssetManifest.json without ever copying the
    # actual bytes into build/flutter_assets/, so `rootBundle.loadString`
    # throws on a real device and the panel falls back to "unavailable".
    # changelog_panel_test.dart asserts this file matches the root one
    # byte-for-byte, so drift between the two fails CI instead of shipping
    # silently.
    - assets/CHANGELOG.md
  fonts:
    # Shipped as assets rather than left to the platform: without them Android
    # renders Roboto, Windows Segoe UI Variable and iOS SF Pro, so the same
    # screen has three different densities and three sets of line breaks.
    #
    # Both are variable fonts, so one file covers every weight — the repeated
    # `weight:` entries only tell Flutter which weights the family can serve.
    # Inter is subset to Latin + punctuation (880 KB → 361 KB); Persian is
    # Vazirmatn's job, and it carries the Arabic script in full.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-subset.ttf
          weight: 400
        - asset: assets/fonts/Inter-subset.ttf
          weight: 500
        - asset: assets/fonts/Inter-subset.ttf
          weight: 600
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/VazirmatnVariable.ttf
          weight: 400
        - asset: assets/fonts/VazirmatnVariable.ttf
          weight: 500
        - asset: assets/fonts/VazirmatnVariable.ttf
          weight: 600
